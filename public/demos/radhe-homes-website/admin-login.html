<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Sign In: Skyline Homes</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=sentient@400,401,500,501&display=swap">
<link rel="stylesheet" href="css/style.css?v=3.2.0">
</head>
<body>
<main class="login">
  <div class="login__box">
    <a class="login__brand" href="index.html">
      <img src="img/logo-full.png" alt="Skyline Homes: Real Estate Developer" width="1100" height="867">
    </a>
    <p class="eyebrow" style="margin:0 0 12px">Admin Panel</p>
    <h1 class="h3" style="margin:0 0 30px">Sign in to manage projects and leads.</h1>

    <form class="form" id="loginForm" novalidate>
      <div class="field">
        <label for="l-user">Username</label>
        <input id="l-user" name="user" type="text" autocomplete="username" placeholder="admin">
        <span class="err"></span>
      </div>
      <div class="field">
        <label for="l-pass">Password</label>
        <input id="l-pass" name="pass" type="password" autocomplete="current-password" placeholder="••••••••">
        <span class="err"></span>
      </div>
      <button class="btn btn--solid btn--block" type="submit">Sign In</button>
    </form>

    <div class="panel" style="margin-top:26px;padding:18px 20px">
      <p class="label" style="margin:0 0 10px">Demo credentials</p>
      <p class="body-sm" style="margin:0 0 14px">Username <b style="color:var(--paper)">admin</b> &nbsp;·&nbsp; Password <b style="color:var(--paper)">skyline@2026</b></p>
      <button class="btn btn--ghost btn--sm" type="button" id="fillDemo">Fill demo credentials</button>
    </div>

    <p style="margin-top:26px"><a class="link-u" href="index.html">Back to website</a></p>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="js/data.js?v=3.2.0"></script>
<script src="js/ui.js?v=3.2.0"></script>
<script>
(function () {
  if (Store.session()) { location.replace("admin.html"); return; }

  const form = $("#loginForm");

  $("#fillDemo").addEventListener("click", () => {
    form.elements.user.value = RR.adminDefault.user;
    form.elements.pass.value = RR.adminDefault.pass;
    fieldError(form.elements.user, ""); fieldError(form.elements.pass, "");
    toast("Demo credentials filled. Press Sign In.");
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const u = form.elements.user.value.trim(), p = form.elements.pass.value;
    let ok = true;
    if (!u) { fieldError(form.elements.user, "Enter your username."); ok = false; } else fieldError(form.elements.user, "");
    if (!p) { fieldError(form.elements.pass, "Enter your password."); ok = false; } else fieldError(form.elements.pass, "");
    if (!ok) return;

    if (Store.login(u, p)) {
      toast("Signed in. Opening the panel…");
      setTimeout(() => location.href = "admin.html", 500);
    } else {
      fieldError(form.elements.pass, "Incorrect username or password.");
      toast("Incorrect username or password.");
    }
  });

  $$("input", form).forEach(i => i.addEventListener("input", () => fieldError(i, "")));
})();
</script>
</body>
</html>
