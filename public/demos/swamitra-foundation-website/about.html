<!-- Content published from the admin panel; replaces the bundled copy above.
     Proxied to Supabase Storage by netlify.toml. -->
<script src="/live/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var D = window.CRF, I = window.swIcon;

  function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }
  function fmt(d) {
    return new Date(d).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  }

  /* Impact statistics */
  set("stats-grid", D.stats.map(function (s) {
    return '<div class="stat"><b data-count="' + s.n + '" data-suffix="' + s.suffix + '">0</b><span>' + s.label + "</span></div>";
  }).join(""));

  /* Registered office from org data */
  var addr = document.getElementById("tx-address");
  if (addr && D.org && D.org.address) addr.textContent = D.org.address;

  /* Annual and impact reports */
  var reports = [
    ["Annual Report", "2025–26", "Governance, activities, programme reach and audited financial statements."],
    ["Impact Report", "2025–26", "Outcomes measured against baseline across schools, workplaces and communities."],
    ["Statement of Accounts", "2025–26", "Audited income, expenditure and utilisation of funds by category."],
    ["Compliance &amp; Safeguarding Summary", "2025–26", "Statutory committee activity, training coverage and policy review record."]
  ];
  set("report-rows", reports.map(function (r) {
    return '<div class="res-item"><span class="res-item__ext">PDF</span>' +
      '<span class="res-item__body"><b>' + r[0] + " " + r[1] + "</b><small>" + r[2] +
      " · Scheduled for publication at the close of the reporting cycle</small></span>" +
      '<span style="color:var(--muted-2)">' + I("clock") + "</span></div>";
  }).join(""));

  /* Publications from the Research Centre */
  set("publication-rows", D.publications.slice(0, 3).map(function (p) {
    return '<a class="res-item" href="featured-publications.html">' +
      '<span class="res-item__ext">PDF</span>' +
      '<span class="res-item__body"><b>' + p.title + "</b><small>" + p.type + " · " + p.theme +
      " · " + p.pages + " pages · " + fmt(p.date) + "</small></span>" +
      '<span style="color:var(--maroon-700)">' + I("file") + "</span></a>";
  }).join(""));

  /* Policies from the legal library */
  var policySlugs = ["privacy-policy", "child-protection-policy", "posh-policy",
    "code-of-ethics", "conflict-of-interest-policy", "whistleblower-policy"];
  set("policy-grid", policySlugs.map(function (slug) {
    var p = D.legal[slug];
    if (!p) return "";
    return '<a class="res-item" href="legal.html?doc=' + slug + '">' +
      '<span class="res-item__ext">' + I("shield") + "</span>" +
      '<span class="res-item__body"><b>' + p.title + "</b><small>Last updated " + p.updated +
      " · " + p.sections.length + " sections</small></span>" +
      '<span style="color:var(--maroon-700)">' + I("file") + "</span></a>";
  }).join(""));
})();
</script>
