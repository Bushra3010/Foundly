<!-- Content published from the admin panel; replaces the bundled copy above.
     Proxied to Supabase Storage by netlify.toml. -->
<script src="/live/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var D = window.SWAMITRA, I = window.swIcon;
  function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }

  /* Ways to get involved */
  var ways = [
    ["users", "Volunteer", "Facilitate sessions, translate material, support camps or assist research. Trained before placement, credited for the work.", "#volunteer"],
    ["handshake", "Partner", "Bring a framework into your school, university, department or company with a written memorandum and named deliverables.", "#partner"],
    ["heart", "Donate", "Fund classroom material, school audits, community camps or master trainer development.", "#donate"],
    ["building", "CSR", "Corporate social responsibility engagements with baseline measurement and audit-ready reporting.", "#csr"],
    ["school", "Internship", "Four to twelve weeks of supervised work on live research, curriculum or programme delivery.", "#internship"],
    ["award", "Careers", "Roles are published as they arise. Speculative applications are read and kept on file.", "#careers"],
    ["globe", "Membership", "Join the network of individuals and institutions implementing this work across the country.", "#membership"]
  ];
  set("ways-grid", ways.map(function (w) {
    return '<a class="card focus-card" href="' + w[3] + '">' +
      '<span class="card__icon">' + I(w[0]) + "</span>" +
      "<h3>" + w[1] + "</h3><p>" + w[2] + "</p>" +
      '<span class="card__foot link-more">Read more</span></a>';
  }).join(""));

  /* CSR focus areas — drawn from the Foundation's focus areas */
  set("csr-grid", D.focus.map(function (f) {
    return '<article class="card focus-card"><span class="card__icon">' + I(f.icon) + "</span>" +
      "<h3>" + f.title + "</h3><p>" + f.text + "</p></article>";
  }).join(""));
})();
</script>
