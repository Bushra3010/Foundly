<!DOCTYPE html>
<html lang="hi" data-base="" data-assets="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>समाचार एवं मीडिया | SWAMITRA Foundation</title>
<meta name="description" content="घोषणाएँ, कार्यक्रम, कार्यक्रम रिपोर्ट, शोध प्रकाशन और सामुदायिक अपडेट खोजने के लिए श्रेणी के अनुसार छाँटें।">
<meta name="theme-color" content="#620405">
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SWAMITRA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="news" data-title="समाचार एवं मीडिया">
<a class="skip-link" href="#main">मुख्य सामग्री पर जाएँ</a>
<div id="site-header"></div>

<main id="main">

  <!-- ===== Hero ===== -->
  <section class="hero hero--page">
    <div class="wrap">
      <nav class="breadcrumb" aria-label="ब्रेडक्रम्ब">
        <a href="index.html">होम</a><span class="sep">/</span><span>समाचार</span>
      </nav>
      <h1>सभी समाचार, नवीनतम से क्रमवार</h1>
      <p class="lead">घोषणाएँ, कार्यक्रम, कार्यक्रम रिपोर्ट, शोध प्रकाशन और सामुदायिक अपडेट खोजने के लिए श्रेणी के अनुसार छाँटें।</p>
    </div>
  </section>


  <section class="section section--cream" id="latest">
    <div class="wrap">

      <div class="chips reveal mb-6" id="news-chips" role="group" aria-label="समाचार को श्रेणी के अनुसार छाँटें">
        <button class="chip" type="button" data-cat="all" aria-pressed="true">सभी</button>
        <button class="chip" type="button" data-cat="घोषणा" aria-pressed="false">घोषणा</button>
        <button class="chip" type="button" data-cat="आयोजन" aria-pressed="false">आयोजन</button>
        <button class="chip" type="button" data-cat="कार्यक्रम" aria-pressed="false">कार्यक्रम</button>
        <button class="chip" type="button" data-cat="अनुसंधान" aria-pressed="false">शोध</button>
        <button class="chip" type="button" data-cat="समुदाय" aria-pressed="false">समुदाय</button>
      </div>

      <div class="grid g-3 grid--rail reveal" id="news-grid"></div>
      <p class="form-note mt-4" id="news-count" role="status" aria-live="polite"></p>

      <div class="pagination mt-8">
        <span aria-hidden="true">पिछला</span>
        <span class="current" aria-current="page">1</span>
        <span aria-hidden="true">अगला</span>
      </div>
      <p class="form-note text-center mt-4">प्रकाशित सभी अपडेट फ़िलहाल एक ही पृष्ठ पर आ जाते हैं। संग्रह बढ़ने के साथ यहाँ अतिरिक्त पृष्ठ दिखाई देंगे।</p>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="../assets/js/ui.hi.js"></script>
<script src="../assets/js/data.hi.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var D = window.SWAMITRA, I = window.swIcon;

  function fmt(d) {
    return new Date(d).toLocaleDateString("hi-IN", { day: "numeric", month: "short", year: "numeric" });
  }
  function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }

  /* Related page for each news category — "Read more" leads somewhere useful */
  function linkFor(cat) {
    if (cat === "अनुसंधान") return "featured-publications.html";
    if (cat === "आयोजन") return "events-calendar.html";
    if (cat === "कार्यक्रम") return "programs.html";
    if (cat === "समुदाय") return "community-legal-awareness-programme.html";
    return "resource-library.html";
  }

  var items = D.news.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

  /* ---- Featured news (most recent) ---- */
  var f = items[0];
  set("featured-news",
    '<article class="card" style="padding:0;overflow:hidden">' +
      '<div class="split" style="gap:0;align-items:stretch">' +
        '<div class="news-card__media" style="aspect-ratio:16/10"><span>' + f.cat.toUpperCase() + "</span></div>" +
        '<div style="padding:var(--s-8);display:flex;flex-direction:column;gap:var(--s-4);justify-content:center">' +
          '<div class="news-card__meta"><span class="tag tag--maroon">' + f.cat + "</span><span>" + fmt(f.date) + "</span></div>" +
          "<h3>" + f.title + "</h3>" +
          "<p>" + f.summary + "</p>" +
          '<a class="link-more" href="' + linkFor(f.cat) + '">आगे पढ़ें</a>' +
        "</div>" +
      "</div>" +
    "</article>"
  );

  /* ---- Latest updates grid ---- */
  set("news-grid", items.map(function (n) {
    return '<article class="card news-card" data-cat="' + n.cat + '">' +
      '<div class="news-card__media"><span>' + n.cat.toUpperCase() + "</span></div>" +
      '<div class="news-card__body">' +
        '<div class="news-card__meta"><span class="tag tag--maroon">' + n.cat + "</span><span>" + fmt(n.date) + "</span></div>" +
        "<h4>" + n.title + "</h4>" +
        '<p style="font-size:var(--fs-sm)">' + n.summary + "</p>" +
        '<a class="card__foot link-more" href="' + linkFor(n.cat) + '">आगे पढ़ें</a>' +
      "</div></article>";
  }).join(""));

  /* ---- Category filter ---- */
  var chips = document.getElementById("news-chips");
  var cards = [].slice.call(document.querySelectorAll("#news-grid [data-cat]"));
  var count = document.getElementById("news-count");

  function applyFilter(cat) {
    var shown = 0;
    cards.forEach(function (c) {
      var match = cat === "all" || c.getAttribute("data-cat") === cat;
      c.style.display = match ? "" : "none";
      if (match) shown++;
    });
    if (count) {
      count.textContent = shown === cards.length
        ? "सभी " + cards.length + " अपडेट दिखाए जा रहे हैं।"
        : cards.length + " में से " + shown + " अपडेट दिखाए जा रहे हैं" + (shown ? " — श्रेणी " + cat + "।" : "। श्रेणी " + cat + " में अभी कोई अपडेट नहीं है।");
    }
  }

  if (chips) {
    chips.addEventListener("click", function (e) {
      var b = e.target.closest(".chip");
      if (!b) return;
      chips.querySelectorAll(".chip").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      applyFilter(b.getAttribute("data-cat"));
    });
  }
  applyFilter("all");

  /* ---- Events ---- */
  set("events-grid", D.events.map(function (ev) {
    return '<article class="card">' +
      '<span class="card__icon">' + I("calendar") + "</span>" +
      '<div class="tag-row"><span class="tag tag--green">आगामी</span><span class="tag tag--grey">' + ev.mode + "</span></div>" +
      "<h3>" + ev.title + "</h3>" +
      '<p><strong>' + fmt(ev.date) + "</strong><br>" + ev.place + " · " + ev.mode + "</p>" +
      '<a class="card__foot btn btn--outline btn--sm" href="contact.html">पंजीकरण करें</a>' +
    "</article>";
  }).join(""));

  /* ---- Media gallery ---- */
  var gallery = [
    ["news", "फोटो", "कक्षा सत्र, प्रशिक्षण कार्यशालाएँ, सामुदायिक शिविर और संस्थागत परामर्श, कार्यक्रम और तिथि के अनुसार व्यवस्थित।"],
    ["globe", "वीडियो", "सत्रों की रिकॉर्डिंग, अधिकारों और कर्तव्यों पर व्याख्यात्मक फिल्में, और प्रत्येक फ्रेमवर्क पर संक्षिप्त ब्रीफिंग।"],
    ["sparkle", "अभियान की मुख्य झलकियाँ", "साझेदार संस्थानों के साथ चलाए गए जागरूकता सप्ताह, सुरक्षा अभियानों और सांविधानिक साक्षरता अभियानों की सामग्री।"],
    ["calendar", "कार्यक्रम एल्बम", "राष्ट्रीय कार्यशालाओं, प्रमाणन समूहों और सम्मेलनों के एल्बम, प्रत्येक में तिथि, स्थान और मेजबान संस्थान का उल्लेख।"]
  ];
  set("gallery-grid", gallery.map(function (g) {
    return '<article class="card focus-card"><span class="card__icon">' + I(g[0]) + "</span>" +
      "<h3>" + g[1] + "</h3><p>" + g[2] + "</p></article>";
  }).join(""));

  /* ---- Media contact email ---- */
  var pk = document.getElementById("pk-email");
  if (pk) { pk.href = "mailto:" + D.org.email; pk.textContent = D.org.email; }
})();
</script>
</body>
</html>
