      <h1>फाउंडेशन के साथ काम करने के सात तरीके</h1>
      <p class="lead">नीचे दिए गए हर मार्ग की अपनी पात्रता, प्रतिबद्धता और प्रक्रिया है। आवेदन करने से पहले वह मार्ग पढ़ें जो आप पर लागू होता है — इससे सभी का समय बचता है।</p>

    <div class="wrap">
      <div class="grid g-3 grid--rail reveal" id="ways-grid"></div>
    </div>
  </section>

<div id="site-footer"></div>

<script src="../assets/js/ui.hi.js"></script>
<script src="../assets/js/data.hi.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var D = window.SWAMITRA, I = window.swIcon;
  function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }

  /* Ways to get involved */
  var ways = [
    ["users", "स्वयंसेवा", "सत्रों का संचालन करें, सामग्री का अनुवाद करें, शिविरों में सहयोग दें या शोध में सहायता करें। नियुक्ति से पहले प्रशिक्षण, और कार्य का श्रेय।", "#volunteer"],
    ["handshake", "साझेदारी", "लिखित समझौता-ज्ञापन और नामित परिणामों के साथ किसी फ्रेमवर्क को अपने स्कूल, विश्वविद्यालय, विभाग या कंपनी में लागू करें।", "#partner"],
    ["heart", "दान", "कक्षा सामग्री, स्कूल ऑडिट, सामुदायिक शिविर या मास्टर ट्रेनर विकास के लिए सहयोग दें।", "#donate"],
    ["building", "CSR", "आधारभूत मापन और ऑडिट-योग्य रिपोर्टिंग के साथ कॉर्पोरेट सामाजिक उत्तरदायित्व सहभागिताएँ।", "#csr"],
    ["school", "इंटर्नशिप", "चल रहे शोध, पाठ्यक्रम या कार्यक्रम क्रियान्वयन पर चार से बारह सप्ताह का पर्यवेक्षित कार्य।", "#internship"],
    ["award", "करियर", "पद उपलब्ध होते ही प्रकाशित किए जाते हैं। स्वप्रेरित आवेदन भी पढ़े जाते हैं और रिकॉर्ड में रखे जाते हैं।", "#careers"],
    ["globe", "सदस्यता", "देश भर में इस कार्य को क्रियान्वित कर रहे व्यक्तियों और संस्थानों के नेटवर्क से जुड़ें।", "#membership"]
  ];
  set("ways-grid", ways.map(function (w) {
    return '<a class="card focus-card" href="' + w[3] + '">' +
      '<span class="card__icon">' + I(w[0]) + "</span>" +
      "<h3>" + w[1] + "</h3><p>" + w[2] + "</p>" +
      '<span class="card__foot link-more">और पढ़ें</span></a>';
  }).join(""));

  /* CSR focus areas — drawn from the Foundation's focus areas */
  set("csr-grid", D.focus.map(function (f) {
    return '<article class="card focus-card"><span class="card__icon">' + I(f.icon) + "</span>" +
      "<h3>" + f.title + "</h3><p>" + f.text + "</p></article>";
  }).join(""));
})();
</script>
</body>
