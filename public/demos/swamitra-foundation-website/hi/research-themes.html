<!DOCTYPE html>
<html lang="hi" data-base="" data-assets="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शोध विषय | SWAMITRA फाउंडेशन</title>
<meta name="description" content="प्रत्येक विषय के अपने अध्ययन, प्रकाशन और फ्रेमवर्क कार्य हैं। मिलकर वे एक ही प्रश्न का उत्तर देते हैं: भारत में किसी व्यक्ति या संस्था को व्यवहार में संवैधानिक रूप से सक्षम बनने के लिए क्या आवश्यक है?">
<meta name="theme-color" content="#620405">
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SWAMITRA">
<meta property="og:title" content="शोध विषय | SWAMITRA फाउंडेशन">
<meta property="og:description" content="SWAMITRA फाउंडेशन से प्रकाशन, नीति पत्र, राष्ट्रीय फ्रेमवर्क, मानक, सर्वेक्षण और सहयोगात्मक शोध।">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="research" data-title="शोध विषय">
<a class="skip-link" href="#main">मुख्य सामग्री पर जाएँ</a>
<div id="site-header"></div>

<main id="main">

  <!-- ===== Hero ===== -->
  <section class="hero hero--page">
    <div class="wrap">
      <nav class="breadcrumb" aria-label="ब्रेडक्रम्ब">
        <a href="index.html">होम</a><span class="sep">/</span><a href="research.html">शोध</a><span class="sep">/</span><span>शोध विषय</span>
      </nav>
      <h1>आठ विषय, एक परस्पर जुड़ा प्रश्न</h1>
      <p class="lead">प्रत्येक विषय के अपने अध्ययन, प्रकाशन और फ्रेमवर्क कार्य हैं। मिलकर वे एक ही प्रश्न का उत्तर देते हैं: भारत में किसी व्यक्ति या संस्था को व्यवहार में संवैधानिक रूप से सक्षम बनने के लिए क्या आवश्यक है?</p>
    </div>
  </section>


  <section class="section" id="themes">
    <div class="wrap">
      <div class="grid g-4 grid--rail reveal" id="themes-grid"></div>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="../assets/js/ui.hi.js"></script>
<script src="../assets/js/data.hi.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var D = window.SWAMITRA, I = window.swIcon;

  function fmt(d) {
    return new Date(d).toLocaleDateString("hi-IN", { day: "numeric", month: "short", year: "numeric" });
  }
  function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }

  /* Inline icons declared with data-icon */
  document.querySelectorAll("[data-icon]").forEach(function (el) {
    el.innerHTML = I(el.getAttribute("data-icon"));
  });

  /* ---- Research themes ---- */
  var THEMES = [
    ["scale", "विधिक शिक्षा", "विधि महाविद्यालयों के बाहर विधिक ज्ञान किस प्रकार पढ़ाया जाता है, और एक ग़ैर-विशेषज्ञ को अपने अधिकारों पर कार्य करने के लिए वास्तव में क्या जानना आवश्यक है।"],
    ["book", "संवैधानिक साक्षरता", "क्या लोग संवैधानिक मूल्यों को उन निर्णयों और विवादों से जोड़ पाते हैं जिनका सामना वे सामान्य जीवन में करते हैं।"],
    ["school", "सुरक्षित विद्यालय", "कोई विद्यालय एक कार्यशील व्यवस्था के रूप में सुरक्षित किस कारण बनता है — समितियाँ, प्रक्रियाएँ और समीक्षा — न कि केवल अलमारी में रखी नीति के रूप में।"],
    ["building", "सुरक्षित कार्यस्थल", "एक अनुपालन-युक्त दस्तावेज़ और ऐसे कार्यस्थल के बीच की दूरी जहाँ कोई व्यक्ति वास्तव में अपनी चिंता उठा सके।"],
    ["shield", "बाल संरक्षण", "संस्थाएँ चिंताओं को किस प्रकार पहचानती, अभिलेखित और सूचित करती हैं, और किन बातों से देखने और कार्रवाई करने के बीच का अंतराल घटता है।"],
    ["chart", "लोक नीति", "शिक्षा, सुरक्षा और न्याय संबंधी नीतियाँ व्यवहार में कहाँ मिलती हैं, और कौन-से हस्तक्षेप क्रियान्वयन की कसौटी पर टिकते हैं।"],
    ["globe", "सुशासन", "जनविश्वास धारण करने वाली संस्थाओं के भीतर पारदर्शिता, जवाबदेही और नैतिक आचरण।"],
    ["users", "नागरिक उत्तरदायित्व", "किसी नागरिक को अधिकार जानने से अधिकार का प्रयोग करने तक, और मत रखने से भागीदारी करने तक कौन-सी बात ले जाती है।"]
  ];
  set("themes-grid", THEMES.map(function (t) {
    return '<article class="card focus-card"><span class="card__icon">' + I(t[0]) + "</span>" +
      "<h3>" + t[1] + "</h3><p>" + t[2] + "</p></article>";
  }).join(""));

  /* Populate the research-area select from the same themes */
  var sel = document.getElementById("rc-area");
  if (sel) {
    THEMES.forEach(function (t) {
      var o = document.createElement("option");
      o.value = t[1]; o.textContent = t[1];
      sel.appendChild(o);
    });
    var other = document.createElement("option");
    other.value = "Other"; other.textContent = "अन्य / अंतर-विषयक";
    sel.appendChild(other);
  }

  /* ---- Publications with a type filter ---- */
  var PUBS = D.publications || [];
  var TYPES = ["शोध पत्र", "श्वेत पत्र", "नीति संक्षेपिका", "कार्यकारी पत्र", "नीति पत्र", "सर्वेक्षण रिपोर्ट"];
  var activeType = "All";

  set("pub-chips",
    ['<button class="chip" type="button" aria-pressed="true" data-type="All">सभी प्रकार</button>']
      .concat(TYPES.map(function (t) {
        return '<button class="chip" type="button" aria-pressed="false" data-type="' + t + '">' + t + "s</button>";
      })).join(""));

  function renderPubs() {
    var list = activeType === "All" ? PUBS : PUBS.filter(function (p) { return p.type === activeType; });
    set("pub-grid", list.map(function (p) {
      return '<article class="card news-card">' +
        '<div class="news-card__media"><span>' + p.type.split(" ")[0].toUpperCase() + "</span></div>" +
        '<div class="news-card__body">' +
          '<div class="news-card__meta"><span class="tag tag--grey">' + p.theme + "</span><span>" + fmt(p.date) + "</span></div>" +
          "<h4>" + p.title + "</h4>" +
          '<p style="font-size:var(--fs-sm)">' + p.type + " · " + p.pages + " पृष्ठ · PDF</p>" +
          '<a class="card__foot link-more" href="#" data-dl="' + p.title + '">डाउनलोड करें</a>' +
        "</div></article>";
    }).join(""));

    var count = document.getElementById("pub-count");
    if (count) count.textContent = PUBS.length + " प्रकाशनों में से " + list.length + " दिखाए जा रहे हैं";
    var empty = document.getElementById("pub-empty");
    if (empty) empty.hidden = list.length > 0;
  }

  var chips = document.getElementById("pub-chips");
  if (chips) {
    chips.addEventListener("click", function (e) {
      var b = e.target.closest(".chip");
      if (!b) return;
      activeType = b.getAttribute("data-type");
      chips.querySelectorAll(".chip").forEach(function (c) {
        c.setAttribute("aria-pressed", String(c === b));
      });
      renderPubs();
    });
  }
  renderPubs();

  /* ---- National frameworks & standards ---- */
  var NAMED = ["National Safe School Framework", "National Safe Workplace Standards", "NLEM Curriculum Framework"];
  var frameworks = (D.resources || []).filter(function (r) {
    return r.type === "संरचना" || NAMED.indexOf(r.title) > -1;
  });
  set("framework-list", frameworks.map(function (r) {
    return '<a class="res-item" href="#" data-dl="' + r.title + '">' +
      '<span class="res-item__ext">' + r.ext + "</span>" +
      '<span class="res-item__body"><b>' + r.title + "</b><small>" + r.cat + " · " + r.type + " · " + r.size + " · " + fmt(r.date) + "</small></span>" +
      '<span style="color:var(--maroon-700)">' + I("file") + "</span></a>";
  }).join(""));

  /* ---- Research statistics ---- */
  var wanted = ["शोध प्रकाशन", "संस्थान जुड़े", "राज्यों तक पहुँच", "रणनीतिक साझेदारियाँ"];
  set("research-stats", (D.stats || []).filter(function (s) {
    return wanted.indexOf(s.label) > -1;
  }).map(function (s) {
    return '<div class="stat"><b data-count="' + s.n + '" data-suffix="' + s.suffix + '">0</b><span>' + s.label + "</span></div>";
  }).join(""));

  /* ---- Surveys & reports (report-type resources + survey publications) ---- */
  var surveys = (D.resources || []).filter(function (r) { return r.type === "रिपोर्ट"; })
    .map(function (r) {
      return { title: r.title, ext: r.ext, meta: r.cat + " · " + r.type + " · " + r.size + " · " + fmt(r.date) };
    })
    .concat(PUBS.filter(function (p) { return p.type === "सर्वेक्षण रिपोर्ट"; }).map(function (p) {
      return { title: p.title, ext: "PDF", meta: p.theme + " · " + p.type + " · " + p.pages + " पृष्ठ · " + fmt(p.date) };
    }));
  set("survey-list", surveys.map(function (s) {
    return '<a class="res-item" href="#" data-dl="' + s.title + '">' +
      '<span class="res-item__ext">' + s.ext + "</span>" +
      '<span class="res-item__body"><b>' + s.title + "</b><small>" + s.meta + "</small></span>" +
      '<span style="color:var(--maroon-700)">' + I("file") + "</span></a>";
  }).join(""));

  /* ---- Research partners marquee ---- */
  var partners = ["विश्वविद्यालय", "विधि महाविद्यालय", "सरकारी अभिकरण", "राज्य शिक्षा बोर्ड",
    "थिंक टैंक", "शोध केंद्र", "ग़ैर-सरकारी संगठन एवं नागरिक समाज", "कॉर्पोरेट एवं CSR"];
  var row = partners.map(function (p) { return '<div class="partner-logo">' + p + "</div>"; }).join("");
  set("partner-track", row + row);

  /* ---- Research news ---- */
  set("research-news-grid", (D.news || []).filter(function (n) {
    return n.cat === "अनुसंधान" || n.cat === "घोषणा";
  }).slice(0, 3).map(function (n) {
    return '<a class="card news-card" href="news.html">' +
      '<div class="news-card__media"><span>' + n.cat.toUpperCase() + "</span></div>" +
      '<div class="news-card__body">' +
        '<div class="news-card__meta"><span class="tag tag--maroon">' + n.cat + "</span><span>" + fmt(n.date) + "</span></div>" +
        "<h4>" + n.title + '</h4><p style="font-size:var(--fs-sm)">' + n.summary + "</p>" +
        '<span class="card__foot link-more">और पढ़ें</span>' +
      "</div></a>";
  }).join(""));

  /* ---- Download links are placeholders until publication ---- */
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-dl]");
    if (!a) return;
    e.preventDefault();
    window.swToast("“" + a.getAttribute("data-dl") + "” प्रकाशन के समय डाउनलोड के लिए उपलब्ध होगा।");
  });
})();
</script>
</body>
</html>
